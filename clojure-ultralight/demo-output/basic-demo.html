<html><head><meta charset="UTF-8" /><title>Clojure Ultralight Demo</title><style type="text/css">* { 
          margin: 0; 
          padding: 0; 
          box-sizing: border-box;
          font-family: -apple-system, 'Segoe UI', 'Roboto', Arial, sans-serif;
        }
        body { 
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          color: white;
          text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .container {
          background: rgba(255,255,255,0.1);
          padding: 40px;
          border-radius: 20px;
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255,255,255,0.2);
          text-align: center;
          max-width: 600px;
          animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        h1 { 
          font-size: 2.5rem; 
          margin-bottom: 20px;
          background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .subtitle { 
          font-size: 1.2rem; 
          margin-bottom: 30px;
          opacity: 0.9;
        }
        .data-section {
          background: rgba(0,0,0,0.2);
          padding: 20px;
          border-radius: 10px;
          margin: 20px 0;
        }
        .data-item {
          margin: 10px 0;
          padding: 10px;
          background: rgba(255,255,255,0.1);
          border-radius: 5px;
          border-left: 4px solid #4ecdc4;
        }
        .button {
          background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
          border: none;
          padding: 12px 24px;
          border-radius: 25px;
          color: white;
          font-weight: bold;
          cursor: pointer;
          margin: 10px;
          transition: transform 0.2s ease;
        }
        .button:hover {
          transform: translateY(-2px);
        }
        .stats {
          display: flex;
          justify-content: space-around;
          margin-top: 20px;
        }
        .stat {
          text-align: center;
        }
        .stat-value {
          font-size: 2rem;
          font-weight: bold;
          color: #4ecdc4;
        }
        .stat-label {
          font-size: 0.9rem;
          opacity: 0.8;
        }</style></head><body><div class="container"><h1>Clojure Ultralight Demo</h1><div class="subtitle">Real-time data rendering with Clojure</div><div class="data-section"><h3>Message</h3><p>This content was generated from Clojure data structures!</p></div><div class="data-section"><h3>Data Items</h3><div class="data-item">Dynamic content generation</div><div class="data-item">Hiccup HTML templating</div><div class="data-item">JavaScript interoperability</div><div class="data-item">Real-time updates</div></div><div class="stats"><div class="stat"><div class="stat-value">60</div><div class="stat-label">FPS</div></div><div class="stat"><div class="stat-value">45MB</div><div class="stat-label">Memory</div></div><div class="stat"><div class="stat-value">2m 30s</div><div class="stat-label">Uptime</div></div><div class="stat"><div class="stat-value">12</div><div class="stat-label">Tasks</div></div></div><div><button class="button" onclick="updateContent()">Update Content</button><button class="button" onclick="showTime()">Show Time</button><button class="button" onclick="changeTheme()">Change Theme</button></div></div></body><script>function updateContent() {
         document.querySelector('h1').textContent = 'Content Updated from JavaScript!';
         document.querySelector('.subtitle').textContent = 'Updated at: ' + new Date().toLocaleTimeString();
       }
       
       function showTime() {
         alert('Current time: ' + new Date().toLocaleString());
       }
       
       function changeTheme() {
         const colors = [
           'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
           'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
           'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
           'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
           'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
         ];
         const randomColor = colors[Math.floor(Math.random() * colors.length)];
         document.body.style.background = randomColor;
       }
       
       // Auto-update time every second
       setInterval(function() {
         const timeElement = document.getElementById('current-time');
         if (timeElement) {
           timeElement.textContent = new Date().toLocaleTimeString();
         }
       }, 1000);</script></html>
