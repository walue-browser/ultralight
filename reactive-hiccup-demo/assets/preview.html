<!DOCTYPE html>
<html>
<head>
    <title>Hiccup Preview</title>
    <style type="text/css">
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', 'Roboto', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #4e95ff, #6032e4, #c478ff);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .content {
            margin-top: 20px;
        }
        
        .message {
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .counter {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .progress-bar {
            height: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #ff6b6b);
            transition: width 0.3s ease;
        }
        
        .data-items {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .data-items h3 {
            margin-bottom: 10px;
        }
        
        .data-items ul {
            list-style-type: none;
        }
        
        .item {
            padding: 8px 15px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            border-left: 4px solid #4ecdc4;
        }
        
        .stats {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .stats h3 {
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ecdc4;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .timestamp {
            text-align: right;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 20px;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        /* Animation for updates */
        @keyframes highlight {
            0% { background-color: rgba(255, 255, 0, 0.3); }
            100% { background-color: transparent; }
        }
        
        .highlight {
            animation: highlight 1s ease-out;
        }
    </style>
</head>
<body>
    <div id="hiccup-container">
        <!-- Hiccup content will be rendered here -->
        <div class="container">
            <h1 class="title">Waiting for Hiccup Content...</h1>
            <div class="subtitle">Edit the Hiccup code in the editor window</div>
        </div>
    </div>
    
    <script>
        // Function to update the content with Hiccup-generated HTML
        function updateHiccupContent(htmlContent) {
            const container = document.getElementById('hiccup-container');
            if (container && htmlContent) {
                // Save scroll position
                const scrollPos = window.scrollY;
                
                // Update content
                container.innerHTML = htmlContent;
                
                // Add highlight effect to show updates
                const elements = container.querySelectorAll('.container, .data-items, .stats, .counter');
                elements.forEach(el => {
                    el.classList.add('highlight');
                    setTimeout(() => el.classList.remove('highlight'), 1000);
                });
                
                // Restore scroll position
                window.scrollTo(0, scrollPos);
                
                console.log("Hiccup content updated");
            }
        }
        
        // Initialize with empty content
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Preview ready for Hiccup content");
        });
    </script>
</body>
</html>
