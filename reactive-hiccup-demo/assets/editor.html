<!DOCTYPE html>
<html lang="en">
<head>
<title>Hiccup Editor</title>
<style type="text/css" media="screen">
    #editor { 
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        font-size: 13px;
    }
    .ace-dracula .ace_marker-layer .ace_active-line {background: #44475a;}
    .ace-dracula .ace_marker-layer .ace_selection {background: #64599a}
    .ace-dracula .ace_gutter-active-line {background-color: #44475a;}
</style>
</head>
<body>

<div id="editor">
</div>
    
<script src="ace-1.4.12-src-min-noconflict/ace.js" type="text/javascript" charset="utf-8"></script>
<script src="ace-1.4.12-src-min-noconflict/ext-language_tools.js" type="text/javascript" charset="utf-8"></script>
<script>
    // Initial Hiccup code
    var hiccupCode = `
;; Clojure Hiccup code
(ns example.hiccup-demo
  (:require [hiccup.core :refer [html]]))

(defn reactive-component [data]
  [:div.container
   [:h1.title (:title data "Reactive Hiccup Demo")]
   [:div.subtitle (:subtitle data "Real-time updates with Clojure & Ultralight")]
   
   [:div.content
    [:p.message (:message data "This content is generated from Hiccup!")]
    
    [:div.counter
     [:h3 "Counter: " [:span.count (:count data 0)]]
     [:div.progress-bar
      [:div.progress {:style (str "width: " (mod (:count data 0) 101) "%")}]]]
    
    [:div.data-items
     [:h3 "Data Items:"]
     [:ul
      (for [item (:items data)]
        [:li.item item])]]
    
    [:div.stats
     [:h3 "Statistics:"]
     [:div.stats-grid
      (for [[key value] (:stats data)]
        [:div.stat-item
         [:div.stat-value value]
         [:div.stat-label key]])]]
    
    [:div.timestamp
     [:p "Last updated: " (:timestamp data "Never")]]]
   
   [:div.footer
    [:p "Powered by Clojure Hiccup & Ultralight"]]])

;; Sample data for the component
(def sample-data
  {:title "Reactive Hiccup Demo"
   :subtitle "Real-time updates with Clojure & Ultralight"
   :message "This content is generated from Hiccup and updates in real-time!"
   :count 42
   :items ["Functional UI generation"
           "Reactive data binding"
           "Real-time updates"
           "Native performance"
           "Cross-platform compatibility"]
   :stats {"Memory" "45MB"
           "CPU" "2%"
           "FPS" 60
           "Uptime" "5m 23s"}
   :timestamp "2025-06-29 12:34:56"})

;; Generate the HTML
(html (reactive-component sample-data))
`;

    // Set up the editor
    var editor = ace.edit("editor");
    editor.setTheme("ace/theme/dracula");
    editor.setValue(hiccupCode);
    editor.session.setMode("ace/mode/clojure");
    editor.setOptions({
      showPrintMargin: false,
      showInvisibles: true,
      enableLiveAutocompletion: true,
      enableSnippets: true
    });
    editor.clearSelection();
    
    // Function to evaluate Hiccup code and update the preview
    function evaluateHiccup() {
        try {
            var content = editor.getSession().getValue();
            updateHiccupPreview(content);
            notifyHiccupUpdate("Hiccup code updated");
        } catch (e) {
            console.error("Error evaluating Hiccup:", e);
        }
    }
    
    // Set up change listener
    editor.getSession().on('change', function() {
        // Debounce the updates to avoid too many calls
        if (window.hiccupUpdateTimeout) {
            clearTimeout(window.hiccupUpdateTimeout);
        }
        window.hiccupUpdateTimeout = setTimeout(evaluateHiccup, 500);
    });
    
    // Initial evaluation
    setTimeout(evaluateHiccup, 100);
</script>
</body>
</html>
